name: Deploy to AWS EC2

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            chat-api/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: chat-api
        run: npm ci

      - name: Backend tests
        working-directory: chat-api
        run: npm test -- --runInBand

      - name: Backend dependency audit
        working-directory: chat-api
        run: npm audit --omit=dev --audit-level=high

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Frontend tests
        working-directory: client
        run: npm test

      - name: Frontend dependency audit
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend build
        working-directory: client
        run: npm run build

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment bundle
        run: |
          tar \
            --exclude='.git' \
            --exclude='**/node_modules' \
            --exclude='**/dist' \
            --exclude='chat-api/.env' \
            --exclude='client/.env' \
            -czf chat-app-${GITHUB_SHA}.tar.gz \
            chat-api client deploy E2EE.md HTTPS.md

      - name: Upload deployment bundle to S3
        run: |
          aws s3 cp "chat-app-${GITHUB_SHA}.tar.gz" \
            "s3://${DEPLOY_BUCKET}/releases/chat-app-${GITHUB_SHA}.tar.gz" \
            --sse AES256

      - name: Deploy through AWS Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy chat application ${GITHUB_SHA}" \
            --parameters commands="[\"set -e\",\"rm -rf /opt/chat-app/release /opt/chat-app/release.tgz\",\"aws s3 cp s3://${DEPLOY_BUCKET}/releases/chat-app-${GITHUB_SHA}.tar.gz /opt/chat-app/release.tgz\",\"mkdir -p /opt/chat-app/release\",\"tar -xzf /opt/chat-app/release.tgz -C /opt/chat-app/release\",\"bash /opt/chat-app/release/deploy/deploy.sh\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) \
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}"; exit 1 ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
